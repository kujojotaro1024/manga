<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<title>seized with rage</title>
		<style type="text/css">
			body {
				margin: 0;
				background-color: #333;
			}

			img {
				display: block;
				position: relative;
			}

				/* 手機版 */
				ul {
					list-style: none;
				padding: 0;
				margin: 0 auto;
					width: 100vw;
				}

				ul li {
					display: block;
				width: 100%;
				position: relative;
					margin-bottom: 0;
				}

				ul img {
					width: 100%;
					margin-bottom: 5vw;
				}

				ul li img:first-child {
					position: relative;
					left: 0;
				}

			/* @media screen and (max-width: 530px) {
			
			} */

			@media screen and (min-width: 1024px) {
				

			/* 電腦版 */
			ul {
				
				width: 80vw;
			}

			ul li {
				

				padding-bottom: -10vw;
				margin-bottom: 20px;
			}

			ul img {
				width: 50%;
			}

			ul li img:first-child {
				position: absolute;
				left: 50%;
			}
			}


		</style>
	</head>

	<body>
		<ul>
			<li>
				<img src="000.jpg" />
				<img src="001.jpg" />
			</li>
			<li>
				<img src="002.jpg" />
				<img src="003.jpg" />
			</li>
			<li>
				<img src="004.jpg" />
				<img src="005.jpg" />
			</li>
			<li>
				<img src="006.jpg" />
				<img src="007.jpg" />
			</li>
			<li>
				<img src="008.jpg" />
				<img src="009.jpg" />
			</li>
			<li>
				<img src="010.jpg" />
				<img src="011.jpg" />
			</li>
			<li>
				<img src="012.jpg" />
				<img src="013.jpg" />
			</li>
			<li>
				<img src="014.jpg" />
				<img src="015.jpg" />
			</li>
			<li>
				<img src="016.jpg" />
				<img src="000.jpg" />
			</li>
		</ul>
	</body>
</html>
